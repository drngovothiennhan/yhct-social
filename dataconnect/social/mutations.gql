mutation SetReaction($postId: UUID!, $type: ReactionType!)
  @auth(level: USER)
  @transaction {
  query @redact {
    user(key: {uid_expr: "auth.uid"}) {
      status @check(expr: "this == 'ACTIVE'", message: "Account is not active")
    }
    post(id: $postId) @check(expr: "this != null", message: "Post not found") {
      status @check(expr: "this == 'ACTIVE'", message: "Post is not active")
    }
  }
  reaction_upsert(
    data: {
      postId: $postId
      userUid_expr: "auth.uid"
      type: $type
    }
  )
}

mutation RemoveReaction($postId: UUID!) @auth(level: USER) {
  reaction_delete(key: {postId: $postId, userUid_expr: "auth.uid"})
}
