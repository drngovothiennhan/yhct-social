mutation UpdateMyDisplayName($displayName: String!) @auth(level: USER) {
  user_update(
    key: {uid_expr: "auth.uid"}
    data: {
      displayName: $displayName
      updatedAt_expr: "request.time"
    }
  )
}

mutation CreatePost($body: String!, $visibility: PostVisibility!)
  @auth(level: USER)
  @transaction {
  query @redact {
    user(key: {uid_expr: "auth.uid"}) {
      status @check(expr: "this == 'ACTIVE'", message: "Account is not active")
    }
  }
  post_insert(
    data: {
      authorUid_expr: "auth.uid"
      body: $body
      visibility: $visibility
    }
  )
}

mutation UpdatePost($postId: UUID!, $body: String!, $visibility: PostVisibility!)
  @auth(level: USER)
  @transaction {
  query @redact {
    post(id: $postId) @check(expr: "this != null", message: "Post not found") {
      author {
        uid @check(expr: "this == auth.uid", message: "Not the post owner")
      }
      status @check(expr: "this == 'ACTIVE'", message: "Post is not active")
    }
  }
  post_update(
    id: $postId
    data: {
      body: $body
      visibility: $visibility
      updatedAt_expr: "request.time"
    }
  )
}

mutation SoftDeletePost($postId: UUID!)
  @auth(level: USER)
  @transaction {
  query @redact {
    post(id: $postId) @check(expr: "this != null", message: "Post not found") {
      author {
        uid @check(expr: "this == auth.uid", message: "Not the post owner")
      }
    }
  }
  post_update(
    id: $postId
    data: {
      status: DELETED
      updatedAt_expr: "request.time"
    }
  )
}

