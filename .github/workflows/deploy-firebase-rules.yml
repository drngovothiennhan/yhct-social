name: Deploy Firebase Rules

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-firebase-rules.yml'
      - '.firebaserc'
      - 'firebase.json'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'

permissions:
  contents: read
  id-token: write

concurrency:
  group: yhct-firestore-rules-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      GOOGLE_CLOUD_PROJECT: yhct-social-260902-42a4
      GCLOUD_PROJECT: yhct-social-260902-42a4
      GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      HAS_GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON != '' }}
      HAS_FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN != '' }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22.16.0'
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate application
        run: npm run check

      - name: Select Firebase authentication mode
        id: auth-mode
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -n "${GCP_WIF_PROVIDER}" && -n "${GCP_DEPLOY_SERVICE_ACCOUNT}" ]]; then
            echo 'mode=wif' >> "$GITHUB_OUTPUT"
            echo 'FIREBASE_AUTH_MODE=wif'
          elif [[ "${HAS_GCP_SERVICE_ACCOUNT_JSON}" == 'true' ]]; then
            echo 'mode=service-account-json' >> "$GITHUB_OUTPUT"
            echo 'FIREBASE_AUTH_MODE=service-account-json'
          elif [[ "${HAS_FIREBASE_TOKEN}" == 'true' ]]; then
            echo 'mode=firebase-token' >> "$GITHUB_OUTPUT"
            echo 'FIREBASE_AUTH_MODE=firebase-token legacy=true'
          else
            echo 'FIREBASE_DEPLOY=BLOCKED reason=NO_SUPPORTED_CREDENTIALS'
            echo 'Configure either GCP_WIF_PROVIDER + GCP_DEPLOY_SERVICE_ACCOUNT, secret GCP_SERVICE_ACCOUNT_JSON, or legacy secret FIREBASE_TOKEN.'
            exit 1
          fi

      - name: Authenticate with Google Cloud OIDC
        if: steps.auth-mode.outputs.mode == 'wif'
        uses: google-github-actions/auth@v3
        with:
          project_id: yhct-social-260902-42a4
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Authenticate with service account JSON
        if: steps.auth-mode.outputs.mode == 'service-account-json'
        uses: google-github-actions/auth@v3
        with:
          project_id: yhct-social-260902-42a4
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Verify Firebase project access with ADC
        if: steps.auth-mode.outputs.mode == 'wif' || steps.auth-mode.outputs.mode == 'service-account-json'
        shell: bash
        run: |
          set -Eeuo pipefail
          npx firebase-tools@15.29.0 projects:list --json --non-interactive > /tmp/firebase-projects.json
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/firebase-projects.json','utf8'));const rows=x.result||[];if(!rows.some(p=>p.projectId==='yhct-social-260902-42a4')){console.error('FIREBASE_PROJECT_ACCESS=DENIED');process.exit(1)}console.log('FIREBASE_PROJECT_ACCESS=PASS')"

      - name: Verify Firebase project access with legacy token
        if: steps.auth-mode.outputs.mode == 'firebase-token'
        shell: bash
        run: |
          set -Eeuo pipefail
          npx firebase-tools@15.29.0 projects:list --json --non-interactive --token "$FIREBASE_TOKEN" > /tmp/firebase-projects.json
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/firebase-projects.json','utf8'));const rows=x.result||[];if(!rows.some(p=>p.projectId==='yhct-social-260902-42a4')){console.error('FIREBASE_PROJECT_ACCESS=DENIED');process.exit(1)}console.log('FIREBASE_PROJECT_ACCESS=PASS')"

      - name: Deploy Firestore and Storage security configuration with ADC
        if: steps.auth-mode.outputs.mode == 'wif' || steps.auth-mode.outputs.mode == 'service-account-json'
        shell: bash
        run: |
          set -Eeuo pipefail
          npx firebase-tools@15.29.0 deploy \
            --project yhct-social-260902-42a4 \
            --only firestore:rules,firestore:indexes,storage \
            --non-interactive

      - name: Deploy Firestore and Storage security configuration with legacy token
        if: steps.auth-mode.outputs.mode == 'firebase-token'
        shell: bash
        run: |
          set -Eeuo pipefail
          npx firebase-tools@15.29.0 deploy \
            --project yhct-social-260902-42a4 \
            --only firestore:rules,firestore:indexes,storage \
            --non-interactive \
            --token "$FIREBASE_TOKEN"
