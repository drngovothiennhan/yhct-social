name: Deploy Firebase Rules

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-firebase-rules.yml'
      - '.firebaserc'
      - 'firebase.json'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'

permissions:
  contents: read
  id-token: write

concurrency:
  group: yhct-firestore-rules-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      GOOGLE_CLOUD_PROJECT: yhct-social-260902-42a4
      GCLOUD_PROJECT: yhct-social-260902-42a4
      GCP_WIF_PROVIDER: projects/244889451934/locations/global/workloadIdentityPools/github-yhct-social/providers/github-main
      GCP_DEPLOY_SERVICE_ACCOUNT: yhct-github-deploy@yhct-social-260902-42a4.iam.gserviceaccount.com
      HAS_GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON != '' }}
      HAS_FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN != '' }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22.16.0'
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate application
        run: npm run check

      - name: Select Firebase authentication mode
        id: auth-mode
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -n "${GCP_WIF_PROVIDER}" && -n "${GCP_DEPLOY_SERVICE_ACCOUNT}" ]]; then
            echo 'mode=wif' >> "$GITHUB_OUTPUT"
            echo 'FIREBASE_AUTH_MODE=wif'
          elif [[ "${HAS_GCP_SERVICE_ACCOUNT_JSON}" == 'true' ]]; then
            echo 'mode=service-account-json' >> "$GITHUB_OUTPUT"
            echo 'FIREBASE_AUTH_MODE=service-account-json'
          elif [[ "${HAS_FIREBASE_TOKEN}" == 'true' ]]; then
            echo 'mode=firebase-token' >> "$GITHUB_OUTPUT"
            echo 'FIREBASE_AUTH_MODE=firebase-token legacy=true'
          else
            echo 'FIREBASE_DEPLOY=BLOCKED reason=NO_SUPPORTED_CREDENTIALS'
            exit 1
          fi

      - name: Authenticate with Google Cloud OIDC
        if: steps.auth-mode.outputs.mode == 'wif'
        uses: google-github-actions/auth@v3
        with:
          project_id: yhct-social-260902-42a4
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Authenticate with service account JSON
        if: steps.auth-mode.outputs.mode == 'service-account-json'
        uses: google-github-actions/auth@v3
        with:
          project_id: yhct-social-260902-42a4
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Verify Firebase project access with ADC
        if: steps.auth-mode.outputs.mode == 'wif' || steps.auth-mode.outputs.mode == 'service-account-json'
        shell: bash
        run: |
          set -Eeuo pipefail
          npx firebase-tools@15.29.0 projects:list --json --non-interactive > /tmp/firebase-projects.json
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/firebase-projects.json','utf8'));const rows=x.result||[];if(!rows.some(p=>p.projectId==='yhct-social-260902-42a4')){console.error('FIREBASE_PROJECT_ACCESS=DENIED');process.exit(1)}console.log('FIREBASE_PROJECT_ACCESS=PASS')"

      - name: Export Firebase Web config
        if: steps.auth-mode.outputs.mode == 'wif' || steps.auth-mode.outputs.mode == 'service-account-json'
        shell: bash
        run: |
          set -Eeuo pipefail
          npx firebase-tools@15.29.0 apps:list --project yhct-social-260902-42a4 --json --non-interactive > /tmp/firebase-apps.json
          APP_ID="$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/firebase-apps.json','utf8'));const rows=x.result||[];const app=rows.find(a=>String(a.platform||'').toUpperCase()==='WEB');if(!app){process.exit(2)}process.stdout.write(app.appId)")"
          npx firebase-tools@15.29.0 apps:sdkconfig WEB "$APP_ID" --project yhct-social-260902-42a4 --json --non-interactive > /tmp/firebase-sdk.json
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/firebase-sdk.json','utf8'));const c=x.result&&x.result.sdkConfig;if(!c||c.projectId!=='yhct-social-260902-42a4'){console.error('FIREBASE_WEB_CONFIG=INVALID');process.exit(1)}console.log('FIREBASE_WEB_CONFIG=PASS');console.log('FIREBASE_WEB_CONFIG_JSON='+JSON.stringify(c))"

      - name: Verify Firebase project access with legacy token
        if: steps.auth-mode.outputs.mode == 'firebase-token'
        shell: bash
        run: |
          set -Eeuo pipefail
          npx firebase-tools@15.29.0 projects:list --json --non-interactive --token "$FIREBASE_TOKEN" > /tmp/firebase-projects.json
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/firebase-projects.json','utf8'));const rows=x.result||[];if(!rows.some(p=>p.projectId==='yhct-social-260902-42a4')){console.error('FIREBASE_PROJECT_ACCESS=DENIED');process.exit(1)}console.log('FIREBASE_PROJECT_ACCESS=PASS')"

      - name: Deploy Firestore rules and indexes with ADC
        if: steps.auth-mode.outputs.mode == 'wif' || steps.auth-mode.outputs.mode == 'service-account-json'
        shell: bash
        run: |
          set -Eeuo pipefail
          npx firebase-tools@15.29.0 deploy \
            --project yhct-social-260902-42a4 \
            --only firestore:rules,firestore:indexes \
            --non-interactive

      - name: Deploy Storage rules with ADC
        if: steps.auth-mode.outputs.mode == 'wif' || steps.auth-mode.outputs.mode == 'service-account-json'
        shell: bash
        run: |
          set -Eeuo pipefail
          npx firebase-tools@15.29.0 deploy \
            --project yhct-social-260902-42a4 \
            --only storage \
            --non-interactive

      - name: Deploy Firestore rules and indexes with legacy token
        if: steps.auth-mode.outputs.mode == 'firebase-token'
        shell: bash
        run: |
          set -Eeuo pipefail
          npx firebase-tools@15.29.0 deploy \
            --project yhct-social-260902-42a4 \
            --only firestore:rules,firestore:indexes \
            --non-interactive \
            --token "$FIREBASE_TOKEN"

      - name: Deploy Storage rules with legacy token
        if: steps.auth-mode.outputs.mode == 'firebase-token'
        shell: bash
        run: |
          set -Eeuo pipefail
          npx firebase-tools@15.29.0 deploy \
            --project yhct-social-260902-42a4 \
            --only storage \
            --non-interactive \
            --token "$FIREBASE_TOKEN"
