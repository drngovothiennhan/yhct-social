name: Diagnose Beta 2.0 Firebase IAM

on:
  push:
    branches: [beta/2.0-module-a]
    paths:
      - '.github/workflows/diagnose-beta2-firebase-iam.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate with Google Cloud OIDC
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: yhct-social-260902-42a4
          workload_identity_provider: projects/244889451934/locations/global/workloadIdentityPools/github-yhct-social/providers/github-main
          service_account: yhct-github-deploy@yhct-social-260902-42a4.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform

      - name: Test effective IAM permissions
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -Eeuo pipefail
          payload='{"permissions":["firebaseauth.users.get","firebaseauth.users.create","firebaseauth.users.update","datastore.entities.get","datastore.entities.create","datastore.entities.update"]}'
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "$payload" \
            "https://cloudresourcemanager.googleapis.com/v1/projects/yhct-social-260902-42a4:testIamPermissions" \
            -o /tmp/iam.json
          node - <<'NODE'
          const fs = require('fs');
          const granted = new Set(JSON.parse(fs.readFileSync('/tmp/iam.json', 'utf8')).permissions || []);
          const required = ['firebaseauth.users.get','firebaseauth.users.create','firebaseauth.users.update','datastore.entities.get','datastore.entities.create','datastore.entities.update'];
          const missing = required.filter((permission) => !granted.has(permission));
          if (missing.length) {
            console.error('BETA2_IAM=FAIL missing=' + missing.join(','));
            process.exit(1);
          }
          console.log('BETA2_IAM=PASS');
          NODE
