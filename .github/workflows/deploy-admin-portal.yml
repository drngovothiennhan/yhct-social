name: Deploy Admin Control Center

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'admin-portal/**'
      - '.github/workflows/deploy-admin-portal.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: yhct-acc-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM: hiu-yhct
      ACC_PROJECT: yhct-social-admin
      RECOVERY_GCP_PROJECT_ID: yhct-social-260902-42a4
      RECOVERY_EXPORT_BUCKET: yhct-social-recovery-prod-244889451934
      FIREBASE_WEB_APP_ID: '1:244889451934:web:68766e1db11f532caeaa8f'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22.16.0'
          package-manager-cache: false

      - name: Validate Vercel token
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${VERCEL_TOKEN:-}" || { echo 'ACC_DEPLOY=BLOCKED missing=VERCEL_TOKEN'; exit 1; }

      - name: Authenticate with Google Cloud OIDC
        id: gcp_auth
        uses: google-github-actions/auth@v3
        with:
          project_id: yhct-social-260902-42a4
          workload_identity_provider: projects/244889451934/locations/global/workloadIdentityPools/github-yhct-social/providers/github-main
          service_account: yhct-github-deploy@yhct-social-260902-42a4.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform

      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: yhct-social-260902-42a4

      - name: Resolve production provider configuration
        id: recovery
        env:
          ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          location="$(gcloud firestore databases describe --database='(default)' --project="$RECOVERY_GCP_PROJECT_ID" --format='value(locationId)')"
          test -n "$location"
          encoded_app_id="$(node -p "encodeURIComponent(process.env.FIREBASE_WEB_APP_ID)")"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://firebase.googleapis.com/v1beta1/projects/${RECOVERY_GCP_PROJECT_ID}/webApps/${encoded_app_id}/config" \
            -o /tmp/firebase-web-config.json
          api_key="$(node -e "const j=require('/tmp/firebase-web-config.json'); if(!j.apiKey)process.exit(2); process.stdout.write(j.apiKey)")"
          echo "::add-mask::$api_key"
          echo "RECOVERY_GCP_LOCATION=$location" >> "$GITHUB_ENV"
          echo "FIREBASE_WEB_API_KEY=$api_key" >> "$GITHUB_ENV"
          echo "RECOVERY_GCP_LOCATION=$location"
          echo 'FIREBASE_WEB_CONFIG=PASS'

      - name: Install ACC dependencies
        working-directory: admin-portal
        run: npm install --no-audit --no-fund

      - name: Validate ACC application
        working-directory: admin-portal
        run: npm run check

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@59.10.0

      - name: Ensure dedicated ACC project exists
        shell: bash
        run: |
          set -Eeuo pipefail
          if vercel project inspect "$ACC_PROJECT" --scope "$VERCEL_TEAM" --token="$VERCEL_TOKEN" >/dev/null 2>&1; then
            echo 'ACC_VERCEL_PROJECT=EXISTS'
          else
            vercel project add "$ACC_PROJECT" --scope "$VERCEL_TEAM" --token="$VERCEL_TOKEN"
            echo 'ACC_VERCEL_PROJECT=CREATED'
          fi

      - name: Normalize ACC project for Next.js
        run: vercel project update "$ACC_PROJECT" --framework nextjs --auto-detect output-directory --yes --scope "$VERCEL_TEAM" --token="$VERCEL_TOKEN"

      - name: Link ACC directory
        run: vercel link --cwd admin-portal --yes --project "$ACC_PROJECT" --scope "$VERCEL_TEAM" --token="$VERCEL_TOKEN"

      - name: Deploy ACC production
        id: deploy
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$FIREBASE_WEB_API_KEY"
          test -n "$RECOVERY_GCP_LOCATION"
          url="$(vercel deploy --cwd admin-portal --prod --yes \
            --scope "$VERCEL_TEAM" \
            --token="$VERCEL_TOKEN" \
            --build-env NEXT_PUBLIC_FIREBASE_API_KEY="$FIREBASE_WEB_API_KEY" \
            --build-env NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN='yhct-social-260902-42a4.firebaseapp.com' \
            --build-env NEXT_PUBLIC_FIREBASE_PROJECT_ID='yhct-social-260902-42a4' \
            --build-env NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET='yhct-social-260902-42a4.firebasestorage.app' \
            --build-env NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID='244889451934' \
            --build-env NEXT_PUBLIC_FIREBASE_APP_ID='1:244889451934:web:68766e1db11f532caeaa8f' \
            --env GCP_PROJECT_NUMBER='244889451934' \
            --env GCP_SERVICE_ACCOUNT_EMAIL='yhct-acc-runtime@yhct-social-260902-42a4.iam.gserviceaccount.com' \
            --env GCP_WORKLOAD_IDENTITY_POOL_ID='vercel-yhct-social' \
            --env GCP_WORKLOAD_IDENTITY_POOL_PROVIDER_ID='vercel-acc' \
            --env RECOVERY_GCP_PROJECT_ID="$RECOVERY_GCP_PROJECT_ID" \
            --env RECOVERY_GCP_LOCATION="$RECOVERY_GCP_LOCATION" \
            --env RECOVERY_EXPORT_BUCKET="$RECOVERY_EXPORT_BUCKET")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "ACC_DEPLOY_URL=$url"

      - name: Verify ACC frontend responds
        shell: bash
        run: |
          set -Eeuo pipefail
          url='${{ steps.deploy.outputs.url }}'
          for attempt in 1 2 3 4 5; do
            status="$(curl -L -sS -o /tmp/acc.html -w '%{http_code}' "$url" || true)"
            if [[ "$status" =~ ^[23][0-9][0-9]$ ]]; then
              grep -q 'Admin Control Center' /tmp/acc.html || true
              echo "ACC_FRONTEND_HTTP=PASS status=$status url=$url"
              exit 0
            fi
            sleep 5
          done
          echo "ACC_FRONTEND_HTTP=FAIL url=$url"
          exit 1
