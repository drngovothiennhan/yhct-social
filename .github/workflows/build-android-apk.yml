name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [release/v1.0]
    paths:
      - 'package.json'
      - 'capacitor.config.ts'
      - 'mobile-shell/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

concurrency:
  group: yhct-android-v1
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22.16.0'
          package-manager-cache: false

      - name: Use Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        run: npx cap add android

      - name: Build debug APK
        shell: bash
        run: |
          set -Eeuo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Stage APK and checksum
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/YHCT-Social-v1.0.0-debug.apk
          sha256sum dist/YHCT-Social-v1.0.0-debug.apk | tee dist/YHCT-Social-v1.0.0-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yhct-social-v1.0.0-android-debug
          path: dist/
          if-no-files-found: error
          retention-days: 30
